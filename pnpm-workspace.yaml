# 本地安装策略（pnpm 11 只读本文件，不读 package.json 的 pnpm 字段）。
#
# overrides 的三条**裸包名**行是承重的：0.1.7-alpha.1 线要求
# `Volatile` 由 cordis 4.0.3 转出（cosmokit 1.8.4 提供），
# `Schema.prototype.volatile` 由 schemastery 3.18.3 提供。名义范围
# （`^4.0.2` / `^3.18.2`）虽覆盖这些版本，但已钉旧 patch 的 lockfile
# 会继续解析到旧版，所以下限必须显式写死。
overrides:
  '@deepseek-ai/cordis': 4.0.3
  '@deepseek-ai/cosmokit': 1.8.4
  '@deepseek-ai/schemastery': 3.18.3

minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
  - '@deepseek-ai/cordis@4.0.3'
  - '@deepseek-ai/cordis-plugin-loader@1.0.4'
  - '@deepseek-ai/cosmokit@1.8.4'
  - '@deepseek-ai/dsh-agent@0.1.2-alpha.2 || 0.1.2-alpha.5 || 0.1.2-rc.1 || 0.1.5-rc.2 || 0.1.7-alpha.1'
  - '@deepseek-ai/dsh-attachment@0.1.2-alpha.2 || 0.1.2-alpha.5 || 0.1.2-rc.1 || 0.1.5-rc.2 || 0.1.7-alpha.1'
  - '@deepseek-ai/dsh-brand@0.1.2-alpha.2 || 0.1.2-alpha.5 || 0.1.2-rc.1 || 0.1.5-rc.2 || 0.1.7-alpha.1'
  - '@deepseek-ai/dsh-code-runtime@0.1.2-alpha.2 || 0.1.2-alpha.5 || 0.1.2-rc.1 || 0.1.5-rc.2 || 0.1.7-alpha.1'
  - '@deepseek-ai/dsh-invariants@0.1.2-alpha.2 || 0.1.2-alpha.5 || 0.1.2-rc.1 || 0.1.5-rc.2 || 0.1.7-alpha.1'
  - '@deepseek-ai/dsh-llm@0.1.2-alpha.2 || 0.1.2-alpha.5 || 0.1.2-rc.1 || 0.1.5-rc.2 || 0.1.7-alpha.1'
  - '@deepseek-ai/dsh-scope@0.1.2-alpha.2 || 0.1.2-alpha.5 || 0.1.2-rc.1 || 0.1.5-rc.2 || 0.1.7-alpha.1'
  - '@deepseek-ai/dsh-session-projection@0.1.2-alpha.2 || 0.1.2-alpha.5 || 0.1.2-rc.1 || 0.1.5-rc.2 || 0.1.7-alpha.1'
