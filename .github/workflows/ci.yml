name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.19', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # 三把类型尺子，缺任一把都不算类型面有证据：
      # checkout 面（有宿主 checkout 才量；runner 上没有 ⇒ 打印"不可验证"并 exit 0）；
      # 已发布线（node_modules，恒量）；客户端面（DOM，恒量）。
      - run: npm run typecheck
      - run: npm run typecheck:ci
      - run: npm run check:client
      - run: npm run check:coverage
      - run: npm run check:readmes
      - run: npm run verify:self-contained
      - run: npm run verify:artifacts
