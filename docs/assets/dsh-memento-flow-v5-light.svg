<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="t d">
<title id="t">dsh-memento structure: a loop between two sessions — session S1 writes through the in-service approval gate into the SQLite store, the audit chain records it, and session S2's first assemble reads the store and freezes it into the systemPrompt segment</title>
<desc id="d">Left column: session S1 (memory tool, /memory command, adapter seed) and session S2 (systemPrompt segment order -50, frozen once, mid-turn memory_recall), separated by a new-session rail. Top lane: MemoryProtocolCore does the budget precheck and the unique substring match, then the approval gate (writePolicy ask, auto or off) carries approval/asked + approval/decided with the full changed text as the payload; denied writes still leave a *-denied row. Middle: the audit chain — session log approval pair, plugin audit table, and the snapshot row that matches system/message verbatim. Bottom lane: the next assemble reads the store synchronously and freezes one snapshot. Right column: memory.db (node:sqlite, WAL, 0600) with entries, audit, proposals and meta, the four per-track/per-layer budgets (2000 / 2000 / 4000 / 4000), and the read-only MCP side door.</desc>
